# Tests the Office Attendance Android app and builds an installable APK.
name: Office Attendance app

on:
  push:
    paths:
      - "office-attendance/**"
      - ".github/workflows/office-attendance.yml"
  pull_request:
    paths:
      - "office-attendance/**"
      - ".github/workflows/office-attendance.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office-attendance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: office-attendance-apk
          path: office-attendance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
